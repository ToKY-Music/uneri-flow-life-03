<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>UNERI Flow - Pure Terrain & High Performance Loop</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #04060a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #mode-floating-btn {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 100;
      background: rgba(10, 14, 24, 0.88);
      border: 1px solid rgba(0, 255, 210, 0.6);
      color: #00ffd2;
      padding: 10px 18px;
      border-radius: 24px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 0 15px rgba(0, 255, 210, 0.25);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.2s ease, background-color 0.2s ease;
      pointer-events: auto;
      will-change: transform;
    }

    #mode-floating-btn.active {
      background: rgba(0, 255, 210, 0.3);
      color: #ffffff;
      box-shadow: 0 0 25px rgba(0, 255, 210, 0.6);
    }

    #ui-container {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 90;
      color: #e0f0ff;
      pointer-events: auto;
      background: rgba(10, 14, 24, 0.9);
      padding: 16px;
      border-radius: 14px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 255, 210, 0.3);
      width: 290px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      transition: width 0.25s ease, height 0.25s ease, padding 0.25s ease, border-radius 0.25s ease;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      will-change: width, height, padding;
    }

    #ui-container.collapsed {
      width: 48px !important;
      height: 48px;
      padding: 0;
      border-radius: 24px;
      cursor: pointer;
      overflow: hidden;
    }

    .ui-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .ui-header-actions {
      display: flex;
      gap: 6px;
    }

    h1 {
      margin: 0;
      font-size: 1.05rem;
      color: #00ffd2;
      letter-spacing: 0.08em;
    }

    .concept-sub {
      margin: 0 0 10px 0;
      font-size: 0.68rem;
      color: #88d8c0;
      line-height: 1.35;
    }

    .icon-btn {
      background: rgba(0, 255, 210, 0.15);
      border: 1px solid rgba(0, 255, 210, 0.4);
      color: #00ffd2;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .collapsed-icon {
      display: none;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: #00ffd2;
    }

    #ui-container.collapsed .tab-container,
    #ui-container.collapsed .tab-content,
    #ui-container.collapsed .ui-header,
    #ui-container.collapsed .concept-sub {
      display: none;
    }

    #ui-container.collapsed .collapsed-icon {
      display: flex;
    }

    .tab-container {
      display: flex;
      border-bottom: 1px solid rgba(0, 255, 210, 0.3);
      margin-bottom: 12px;
      gap: 4px;
    }

    .tab-btn {
      flex: 1;
      padding: 6px 0;
      font-size: 0.65rem;
      text-align: center;
      background: rgba(0, 255, 210, 0.05);
      color: #88d8c0;
      border: none;
      border-radius: 6px 6px 0 0;
      cursor: pointer;
      font-weight: bold;
    }

    .tab-btn.active {
      background: rgba(0, 255, 210, 0.25);
      color: #00ffd2;
      border-bottom: 2px solid #00ffd2;
    }

    .tab-content {
      display: none;
      max-height: 48vh;
      overflow-y: auto;
    }

    .tab-content.active {
      display: block;
    }

    .guide-section {
      background: rgba(0, 255, 210, 0.05);
      border: 1px solid rgba(0, 255, 210, 0.2);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }

    .guide-title {
      font-size: 0.7rem;
      font-weight: bold;
      color: #00ffd2;
      margin-bottom: 6px;
    }

    .guide-list {
      font-size: 0.64rem;
      color: #b0f0e0;
      line-height: 1.5;
      margin: 0;
      padding-left: 14px;
    }

    .control-group {
      margin-bottom: 10px;
    }

    label {
      display: flex;
      justify-content: space-between;
      font-size: 0.68rem;
      color: #a0f0e0;
      margin-bottom: 2px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #00ffd2;
      cursor: pointer;
      height: 4px;
    }

    .switch-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 0.7rem;
      color: #a0f0e0;
    }

    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 18px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider-round {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255, 255, 255, 0.2);
      border-radius: 18px;
      border: 1px solid rgba(0, 255, 210, 0.4);
    }

    .slider-round:before {
      position: absolute;
      content: "";
      height: 12px;
      width: 12px;
      left: 2px;
      bottom: 2px;
      background-color: #00ffd2;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider-round {
      background-color: rgba(0, 255, 210, 0.4);
    }

    input:checked + .slider-round:before {
      transform: translateX(18px);
      background-color: #ffffff;
    }

    .action-btn {
      width: 100%;
      padding: 8px;
      margin-top: 6px;
      background: rgba(255, 90, 90, 0.15);
      border: 1px solid rgba(255, 90, 90, 0.4);
      color: #ff9090;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.7rem;
      font-weight: bold;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <button id="mode-floating-btn" title="操作モード切替 (Spaceキー)">
    <span id="mode-icon">✨</span>
    <span id="mode-text">粒子発生モード</span>
  </button>

  <div id="ui-container">
    <div class="collapsed-icon" title="メニューを開く">⚙️</div>

    <div class="ui-header">
      <h1>UNERI Flow</h1>
      <div class="ui-header-actions">
        <div class="icon-btn" id="reset-cam-btn" title="視点をリセット (R)">🏠</div>
        <div class="icon-btn" id="toggle-btn" title="メニューを折りたたむ">─</div>
      </div>
    </div>
    
    <p class="concept-sub">地形を滑り、集い、形を変える。<br>流動的な生命とうねりのシミュレーション。</p>

    <div class="tab-container">
      <button class="tab-btn active" data-tab="tab-control">🎮 操作</button>
      <button class="tab-btn" data-tab="tab-eco">🌿 生態系</button>
      <button class="tab-btn" data-tab="tab-audio">🔊 音響</button>
    </div>

    <!-- タブ1: 操作説明 -->
    <div class="tab-content active" id="tab-control">
      <div class="guide-section">
        <div class="guide-title">📱 タッチ / マウス操作</div>
        <ul class="guide-list">
          <li><strong>【粒子発生モード】</strong><br>1本指ドラッグ: 粒子を連続生成</li>
          <li><strong>【視点操作モード】</strong><br>1本指ドラッグ: 3D角度回転<br>2本指スライド: 平行移動 (パン)</li>
          <li><strong>【PC操作】</strong><br>Shift + ドラッグ または 右ドラッグ: 平行移動</li>
          <li><strong>【共通】</strong><br>ピンチ / ホイール: ズーム移動</li>
        </ul>
      </div>

      <button class="action-btn" id="clear-particles-btn">🗑️ 全粒子をリセット (C)</button>
    </div>

    <!-- タブ2: 生態系パラメーター -->
    <div class="tab-content" id="tab-eco">
      <div class="switch-group">
        <span>境界（空間端）での反転</span>
        <label class="toggle-switch">
          <input type="checkbox" id="boundary-enable" checked>
          <span class="slider-round"></span>
        </label>
      </div>

      <div class="control-group">
        <label><span>孤独時の寿命減衰率</span><span id="exp-val">2.2</span></label>
        <input type="range" id="exp-slider" min="1.0" max="3.5" step="0.1" value="2.2">
      </div>

      <div class="control-group">
        <label><span>「ひとりぼっち」の判定閾値</span><span id="thresh-val">0.0010</span></label>
        <input type="range" id="thresh-slider" min="0.0000" max="0.0050" step="0.0002" value="0.0010">
      </div>

      <div class="control-group">
        <label><span>融合・進化の確率</span><span id="react-val">1.0</span></label>
        <input type="range" id="react-slider" min="0.0" max="3.0" step="0.1" value="1.0">
      </div>

      <div class="control-group">
        <label><span>進化粒子の崩壊時間</span><span id="decay-val">1.0</span></label>
        <input type="range" id="decay-slider" min="0.1" max="3.0" step="0.1" value="1.0">
      </div>

      <div class="control-group">
        <label><span>進化粒子のサイズ上限</span><span id="size-val">1.50</span></label>
        <input type="range" id="size-slider" min="0.5" max="3.0" step="0.05" value="1.50">
      </div>
    </div>

    <!-- タブ3: 音響設定 -->
    <div class="tab-content" id="tab-audio">
      <div class="switch-group">
        <span>マスター音声 (ON/OFF)</span>
        <label class="toggle-switch">
          <input type="checkbox" id="audio-enable" checked>
          <span class="slider-round"></span>
        </label>
      </div>

      <div class="control-group">
        <label><span>発生音量 (Spawn Vol)</span><span id="vol-spawn-val">1.5</span></label>
        <input type="range" id="vol-spawn-slider" min="0.0" max="4.0" step="0.1" value="1.5">
      </div>

      <div class="control-group">
        <label><span>移動音量 (Motion Vol)</span><span id="vol-motion-val">2.0</span></label>
        <input type="range" id="vol-motion-slider" min="0.0" max="5.0" step="0.1" value="2.0">
      </div>

      <div class="control-group">
        <label><span>融合音量 (Fusion Vol)</span><span id="vol-fusion-val">1.5</span></label>
        <input type="range" id="vol-fusion-slider" min="0.0" max="4.0" step="0.1" value="1.5">
      </div>
    </div>

  </div>

  <script>
    // ==========================================
    // 0. UI・制御変数
    // ==========================================
    let globalTime = 0;
    let expFactor = 2.2;
    let thresholdValue = 0.0010;
    let reactivityFactor = 1.0; 
    let decayTimeFactor = 1.0;  
    let sizeLimitThreshold = 1.50; 

    let isBoundaryBounceEnabled = true;

    let isAudioEnabled = true;
    let volSpawn = 1.5;
    let volMotion = 2.0;
    let volFusion = 1.5;

    let isCameraMode = false; 

    // ② 高速化用モジュール共有ワークベクトル（アロケーションカット）
    const VEC_COHESION = new THREE.Vector3();
    const VEC_SEPARATION = new THREE.Vector3();
    const VEC_ALIGNMENT = new THREE.Vector3();
    const VEC_PUSH = new THREE.Vector3();
    const VEC_WIND = new THREE.Vector3();
    const VEC_TEMP = new THREE.Vector3();

    const uiContainer = document.getElementById('ui-container');
    const toggleBtn = document.getElementById('toggle-btn');
    const resetCamBtn = document.getElementById('reset-cam-btn');
    
    const modeFloatingBtn = document.getElementById('mode-floating-btn');
    const modeIcon = document.getElementById('mode-icon');
    const modeText = document.getElementById('mode-text');

    function toggleUI(e) {
      if (e) e.stopPropagation();
      uiContainer.classList.toggle('collapsed');
    }

    toggleBtn.addEventListener('click', toggleUI);
    uiContainer.addEventListener('click', (e) => {
      if (uiContainer.classList.contains('collapsed')) toggleUI(e);
    });

    const tabBtns = document.querySelectorAll('.tab-btn');
    const tabContents = document.querySelectorAll('.tab-content');

    tabBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const targetTab = btn.getAttribute('data-tab');

        tabBtns.forEach(b => b.classList.remove('active'));
        tabContents.forEach(c => c.classList.remove('active'));

        btn.classList.add('active');
        document.getElementById(targetTab).classList.add('active');
      });
    });

    function setCameraMode(enabled) {
      isCameraMode = enabled;
      modeFloatingBtn.classList.toggle('active', isCameraMode);
      if (isCameraMode) {
        modeIcon.textContent = '🎥';
        modeText.textContent = '視点操作モード';
      } else {
        modeIcon.textContent = '✨';
        modeText.textContent = '粒子発生モード';
      }
    }

    modeFloatingBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      setCameraMode(!isCameraMode);
    });

    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (e.code === 'Space') {
        e.preventDefault();
        setCameraMode(!isCameraMode);
      } else if (e.key === 'r' || e.key === 'R') {
        resetCameraPos();
      } else if (e.key === 'c' || e.key === 'C') {
        clearAllParticles();
      }
    });

    const bindSlider = (sliderId, displayId, callback) => {
      const slider = document.getElementById(sliderId);
      const display = document.getElementById(displayId);
      slider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        display.textContent = val.toFixed(1);
        callback(val);
      });
    };

    document.getElementById('boundary-enable').addEventListener('change', (e) => {
      isBoundaryBounceEnabled = e.target.checked;
    });

    bindSlider('exp-slider', 'exp-val', v => expFactor = v);
    document.getElementById('thresh-slider').addEventListener('input', (e) => {
      thresholdValue = parseFloat(e.target.value);
      document.getElementById('thresh-val').textContent = thresholdValue.toFixed(4);
    });

    bindSlider('react-slider', 'react-val', v => reactivityFactor = v);
    bindSlider('decay-slider', 'decay-val', v => decayTimeFactor = v);
    document.getElementById('size-slider').addEventListener('input', (e) => {
      sizeLimitThreshold = parseFloat(e.target.value);
      document.getElementById('size-val').textContent = sizeLimitThreshold.toFixed(2);
    });

    document.getElementById('audio-enable').addEventListener('change', (e) => {
      isAudioEnabled = e.target.checked;
      if (audioCtx) {
        if (isAudioEnabled) audioCtx.resume();
        else audioCtx.suspend();
      }
    });

    bindSlider('vol-spawn-slider', 'vol-spawn-val', v => volSpawn = v);
    bindSlider('vol-motion-slider', 'vol-motion-val', v => volMotion = v);
    bindSlider('vol-fusion-slider', 'vol-fusion-val', v => volFusion = v);

    // ==========================================
    // 1. Web Audio API (軽量化ボイスプール)
    // ==========================================
    let audioCtx = null;
    let masterFilter = null;
    const MAX_VOICES = 4;
    const voicePool = [];

    function initAudio() {
      if (!isAudioEnabled) return;
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
          
          masterFilter = audioCtx.createBiquadFilter();
          masterFilter.type = 'lowpass';
          masterFilter.frequency.setValueAtTime(1800, audioCtx.currentTime);
          masterFilter.connect(audioCtx.destination);

          for (let i = 0; i < MAX_VOICES; i++) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            let panner = null;
            if (audioCtx.createPanner) {
              panner = audioCtx.createPanner();
              panner.panningModel = 'equalpower';
              panner.distanceModel = 'inverse';
              panner.refDistance = 5;
            }

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(220, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
            
            if (panner) {
              osc.connect(gain);
              gain.connect(panner);
              panner.connect(masterFilter);
            } else {
              osc.connect(gain);
              gain.connect(masterFilter);
            }

            osc.start();
            voicePool.push({ osc, gain, panner });
          }
        }
      }
      if (audioCtx && audioCtx.state === 'suspended' && isAudioEnabled) {
        audioCtx.resume();
      }
    }

    function playPokoSound(pitchRatio = 1.0, isFusion = false, pos = null) {
      if (!isAudioEnabled || !audioCtx || audioCtx.state !== 'running') return;
      const baseVolume = isFusion ? volFusion : volSpawn;
      if (baseVolume <= 0.001) return;

      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        let panner = null;
        if (pos && audioCtx.createPanner) {
          panner = audioCtx.createPanner();
          panner.positionX.setValueAtTime(pos.x, audioCtx.currentTime);
          panner.positionY.setValueAtTime(pos.y, audioCtx.currentTime);
          panner.positionZ.setValueAtTime(pos.z, audioCtx.currentTime);
        }

        const baseFreq = 260 + Math.random() * 200;
        osc.frequency.setValueAtTime(baseFreq * pitchRatio, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(baseFreq * 2.6 * pitchRatio, audioCtx.currentTime + 0.05);

        const targetGain = 0.18 * baseVolume;
        gain.gain.setValueAtTime(targetGain, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.06);

        if (panner) {
          osc.connect(gain);
          gain.connect(panner);
          panner.connect(masterFilter || audioCtx.destination);
        } else {
          osc.connect(gain);
          gain.connect(masterFilter || audioCtx.destination);
        }

        osc.start();
        osc.stop(audioCtx.currentTime + 0.07);
      } catch (e) {}
    }

    // ==========================================
    // 2. Three.js セットアップ
    // ==========================================
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x04060a, 0.0008); 

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 50000);
    
    let cameraTarget = new THREE.Vector3(0, 0, 0);
    let cameraRadius = 45;
    let cameraTheta = 0;            
    let cameraPhi = Math.PI * 0.35; 

    function updateCameraPosition() {
      cameraRadius = Math.max(8, Math.min(cameraRadius, 150));
      cameraPhi = Math.max(0.05, Math.min(Math.PI * 0.48, cameraPhi));

      camera.position.x = cameraTarget.x + cameraRadius * Math.sin(cameraPhi) * Math.sin(cameraTheta);
      camera.position.y = cameraTarget.y + cameraRadius * Math.cos(cameraPhi);
      camera.position.z = cameraTarget.z + cameraRadius * Math.sin(cameraPhi) * Math.cos(cameraTheta);
      camera.lookAt(cameraTarget);
    }

    function resetCameraPos() {
      cameraTarget.set(0, 0, 0);
      cameraRadius = 45;
      cameraTheta = 0;
      cameraPhi = Math.PI * 0.35;
      updateCameraPosition();
    }

    resetCamBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      resetCameraPos();
    });

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0x223344, 0.9);
    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(0x00ffd2, 1.4);
    mainLight.position.set(30, 50, 40);
    scene.add(mainLight);

    const subLight = new THREE.DirectionalLight(0xff4080, 0.7);
    subLight.position.set(-30, -20, -20);
    scene.add(subLight);

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    // ==========================================
    // 2.5 3D地形 & 風のベクトル矢印場 (① くぼみ完全削除)
    // ==========================================
    const GRID_SIZE = 40;
    const TERRAIN_WIDTH = 240;
    const fieldPlaneGeo = new THREE.PlaneGeometry(TERRAIN_WIDTH, TERRAIN_WIDTH, GRID_SIZE, GRID_SIZE);
    fieldPlaneGeo.rotateX(-Math.PI / 2);

    const fieldMat = new THREE.MeshPhongMaterial({
      color: 0x004440,
      emissive: 0x001a18,
      specular: 0x00ffd2,
      wireframe: true,
      transparent: true,
      opacity: 0.55,
      shininess: 30
    });
    
    const fieldMesh = new THREE.Mesh(fieldPlaneGeo, fieldMat);
    fieldMesh.position.set(0, -10, 0);
    scene.add(fieldMesh);

    // ★ ① 地形の純粋な基本高度（粒子による沈み込みを完全に削除し、形状収斂を防止）
    function getTerrainHeight(x, z, time) {
      const wave1 = Math.sin(x * 0.035 + time * 0.8) * Math.cos(z * 0.035);
      const wave2 = Math.cos(x * 0.018 - time * 0.5) * Math.sin(z * 0.022) * 2.5;
      return (wave1 * 4.5 + wave2) - 10; 
    }

    function getWindVector(x, y, z, time, outVec) {
      const windX = Math.sin(x * 0.02 + time * 1.2) * Math.cos(z * 0.02) * 0.08;
      const windY = Math.cos(y * 0.03 + time * 0.8) * 0.02;
      const windZ = Math.cos(x * 0.02) * Math.sin(z * 0.02 + time * 1.0) * 0.08;
      outVec.set(windX, windY, windZ);
      return outVec;
    }

    const arrowGroup = new THREE.Group();
    const ARROW_COUNT_X = 8;
    const ARROW_COUNT_Z = 8;
    const arrows = [];

    const arrowGeo = new THREE.ConeGeometry(0.2, 0.7, 4);
    arrowGeo.rotateX(Math.PI / 2);
    const arrowMat = new THREE.MeshBasicMaterial({
      color: 0x00ffd2,
      transparent: true,
      opacity: 0.45,
      wireframe: true
    });

    for (let ix = -ARROW_COUNT_X/2; ix <= ARROW_COUNT_X/2; ix++) {
      for (let iz = -ARROW_COUNT_Z/2; iz <= ARROW_COUNT_Z/2; iz++) {
        const arrow = new THREE.Mesh(arrowGeo, arrowMat);
        const posX = ix * (TERRAIN_WIDTH / ARROW_COUNT_X) * 0.7;
        const posZ = iz * (TERRAIN_WIDTH / ARROW_COUNT_Z) * 0.7;
        arrow.position.set(posX, 0, posZ);
        arrowGroup.add(arrow);
        arrows.push(arrow);
      }
    }
    scene.add(arrowGroup);

    function update3DEnvironment() {
      const posAttr = fieldPlaneGeo.attributes.position;
      for (let i = 0; i < posAttr.count; i++) {
        const x = posAttr.getX(i);
        const z = posAttr.getZ(i);
        const h = getTerrainHeight(x, z, globalTime);
        posAttr.setY(i, h + 10);
      }
      posAttr.needsUpdate = true;
      fieldPlaneGeo.computeVertexNormals();

      arrows.forEach(arrow => {
        const h = getTerrainHeight(arrow.position.x, arrow.position.z, globalTime);
        arrow.position.y = h + 2.5;
        getWindVector(arrow.position.x, arrow.position.y, arrow.position.z, globalTime, VEC_WIND);
        VEC_TEMP.copy(arrow.position).addScaledVector(VEC_WIND, 10);
        arrow.lookAt(VEC_TEMP);
      });
    }

    // ==========================================
    // 3. 空間分割グリッド (Spatial Hash Grid)
    // ==========================================
    const GRID_CELL_SIZE = 8.0;
    const spatialGrid = new Map();

    function getKey(x, y, z) {
      const gx = Math.floor(x / GRID_CELL_SIZE);
      const gy = Math.floor(y / GRID_CELL_SIZE);
      const gz = Math.floor(z / GRID_CELL_SIZE);
      return `${gx},${gy},${gz}`;
    }

    function updateSpatialGrid() {
      spatialGrid.clear();

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        const key = getKey(p.mesh.position.x, p.mesh.position.y, p.mesh.position.z);
        let cell = spatialGrid.get(key);
        if (!cell) {
          cell = [];
          spatialGrid.set(key, cell);
        }
        cell.push(p);
      }
    }

    function getNearbyParticles(p, outNeighbors) {
      outNeighbors.length = 0;
      const gx = Math.floor(p.mesh.position.x / GRID_CELL_SIZE);
      const gy = Math.floor(p.mesh.position.y / GRID_CELL_SIZE);
      const gz = Math.floor(p.mesh.position.z / GRID_CELL_SIZE);

      for (let x = -1; x <= 1; x++) {
        for (let y = -1; y <= 1; y++) {
          for (let z = -1; z <= 1; z++) {
            const key = `${gx + x},${gy + y},${gz + z}`;
            const cell = spatialGrid.get(key);
            if (cell) {
              for (let i = 0; i < cell.length; i++) {
                if (cell[i] !== p) outNeighbors.push(cell[i]);
              }
            }
          }
        }
      }
      return outNeighbors;
    }

    // ==========================================
    // 3.5 粒子クラス (② 高速化マテリアル・無限生成)
    // ==========================================
    let particles = [];
    const tempNeighborBuffer = [];

    function clearAllParticles() {
      for (let i = 0; i < particles.length; i++) particles[i].destroy();
      particles = [];
      spatialGrid.clear();
    }

    document.getElementById('clear-particles-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      clearAllParticles();
    });

    const baseSphereGeo = new THREE.SphereGeometry(0.28, 12, 12);
    
    // ② マテリアルの共通プール化による描画負荷削減
    const sharedMaterial = new THREE.MeshPhongMaterial({
      color: 0x00ffd2,
      emissive: 0x022018,
      specular: 0xffffff,
      shininess: 90,
      transparent: true,
      opacity: 0.92
    });

    class ChibiParticle {
      constructor(x, y, z, initialVel, options = {}) {
        // ② インスタンス生成時の軽量化マテリアル処理
        this.material = sharedMaterial.clone();
        this.mesh = new THREE.Mesh(baseSphereGeo, this.material);
        this.mesh.position.set(x, y, z);
        
        this.type = options.type !== undefined ? options.type : 0;
        this.radius = Math.min(options.radius !== undefined ? options.radius : 0.28, 5.0);
        this.hue = options.hue !== undefined ? options.hue : (0.40 + Math.random() * 0.18);
        this.attractionPower = options.attractionPower !== undefined ? Math.min(options.attractionPower, 0.06) : 0.008;
        this.lifeBonus = options.lifeBonus !== undefined ? Math.min(options.lifeBonus, 3.5) : 1.0;
        
        this.mesh.scale.setScalar(this.radius / 0.28);
        this.material.color.setHSL(this.hue % 1.0, 0.85, 0.60);

        this.velocity = initialVel.clone().add(VEC_TEMP.set(
          (Math.random() - 0.5) * 0.1,
          (Math.random() - 0.5) * 0.1,
          (Math.random() - 0.5) * 0.1
        ));

        this.life = 1.0;
        this.baseDecay = (0.025 + Math.random() * 0.005) / this.lifeBonus;
        this.age = 0;
        this.decomposed = false;
        this.fusionCooldown = options.fusionCooldown !== undefined ? options.fusionCooldown : 15;

        this.baseFreq = (80 + Math.random() * 120) * Math.pow(0.9, Math.min(this.type, 8));
      }

      applyFlockingRule(neighbors) {
        VEC_COHESION.set(0, 0, 0);
        VEC_SEPARATION.set(0, 0, 0);
        VEC_ALIGNMENT.set(0, 0, 0);
        let count = 0;

        for (let i = 0; i < neighbors.length; i++) {
          const other = neighbors[i];
          const dist = this.mesh.position.distanceTo(other.mesh.position);

          if (dist > 0 && dist < 7.0) {
            VEC_COHESION.add(other.mesh.position);
            VEC_ALIGNMENT.add(other.velocity);

            if (dist < (1.1 * (this.radius + other.radius) / 0.56)) {
              VEC_PUSH.subVectors(this.mesh.position, other.mesh.position);
              VEC_PUSH.normalize().divideScalar(Math.max(dist, 0.1));
              VEC_SEPARATION.add(VEC_PUSH);
            }
            count++;
          }
        }

        if (count > 0) {
          VEC_COHESION.divideScalar(count);
          VEC_TEMP.subVectors(VEC_COHESION, this.mesh.position).multiplyScalar(this.attractionPower);
          this.velocity.add(VEC_TEMP);
          VEC_ALIGNMENT.divideScalar(count).multiplyScalar(0.02);
          this.velocity.add(VEC_ALIGNMENT);
          VEC_SEPARATION.multiplyScalar(0.025);
          this.velocity.add(VEC_SEPARATION);
        }

        getWindVector(this.mesh.position.x, this.mesh.position.y, this.mesh.position.z, globalTime, VEC_WIND);
        const windWeight = Math.max(0.15, 1.0 - (this.radius - 0.28) * 0.25);
        this.velocity.addScaledVector(VEC_WIND, windWeight);

        if (isBoundaryBounceEnabled) {
          const boundX = TERRAIN_WIDTH * 0.42;
          const boundZ = TERRAIN_WIDTH * 0.42;
          const boundYMax = 35;

          if (this.mesh.position.x > boundX) { this.velocity.x -= 0.05; }
          if (this.mesh.position.x < -boundX) { this.velocity.x += 0.05; }
          if (this.mesh.position.z > boundZ) { this.velocity.z -= 0.05; }
          if (this.mesh.position.z < -boundZ) { this.velocity.z += 0.05; }
          if (this.mesh.position.y > boundYMax) { this.velocity.y -= 0.05; }
        }
      }

      update(neighbors) {
        const mass = Math.pow(this.radius / 0.28, 1.5);
        const gravity = 0.008 * Math.min(mass, 8.0);
        this.velocity.y -= gravity;

        this.velocity.multiplyScalar(0.96);
        this.mesh.position.add(this.velocity);
        this.age += 1;

        const terrainY = getTerrainHeight(this.mesh.position.x, this.mesh.position.z, globalTime);
        const surfaceY = terrainY + this.radius;

        if (this.mesh.position.y <= surfaceY) {
          this.mesh.position.y = surfaceY;
          if (this.velocity.y < 0) this.velocity.y *= -0.2;

          const delta = 0.5;
          const hL = getTerrainHeight(this.mesh.position.x - delta, this.mesh.position.z, globalTime);
          const hR = getTerrainHeight(this.mesh.position.x + delta, this.mesh.position.z, globalTime);
          const hD = getTerrainHeight(this.mesh.position.x, this.mesh.position.z - delta, globalTime);
          const hU = getTerrainHeight(this.mesh.position.x, this.mesh.position.z + delta, globalTime);

          const slopeX = (hL - hR) * 0.02;
          const slopeZ = (hD - hU) * 0.02;
          this.velocity.x += slopeX;
          this.velocity.z += slopeZ;

          const breath = 1.0 + Math.sin(globalTime * 3.0 + this.age * 0.05) * 0.08;
          const squish = Math.min(1.3, (1.0 + (mass * 0.04))) * breath;
          const baseScale = this.radius / 0.28;
          this.mesh.scale.set(baseScale * squish, baseScale / (squish * 0.85), baseScale * squish);
        } else {
          const baseScale = this.radius / 0.28;
          this.mesh.scale.set(baseScale, baseScale, baseScale);
        }

        if (this.fusionCooldown > 0) this.fusionCooldown--;

        // 大型粒子（type > 0）は崩壊時間経過で必ず分解フラグを立てる
        if (this.type > 0) {
          let baseDecomposeAge = (220 + this.type * 90) * decayTimeFactor;
          if (this.radius > sizeLimitThreshold) {
            baseDecomposeAge /= Math.max(1.1, Math.pow(this.radius / sizeLimitThreshold, 2));
          }
          if (this.age > baseDecomposeAge) {
            this.decomposed = true;
            return false;
          }
          this.material.opacity = 0.92;
          return true; 
        }

        let proximitySupport = 0;
        for (let i = 0; i < neighbors.length; i++) {
          const other = neighbors[i];
          const dist = this.mesh.position.distanceTo(other.mesh.position);
          if (dist < 12.0) {
            proximitySupport += (1.0 / Math.pow(dist + 0.1, expFactor)) * 0.0035;
          }
        }

        let totalSupport = (proximitySupport > thresholdValue) ? (proximitySupport + particles.length * 0.00003) : 0;
        this.life -= Math.max(0.0003, this.baseDecay - totalSupport);
        this.material.opacity = Math.max(0, this.life * 0.92);

        return this.life > 0;
      }

      destroy() {
        scene.remove(this.mesh);
        this.mesh.geometry.dispose();
        this.material.dispose();
      }
    }

    // ==========================================
    // 4. タッチ・ピンチ・パン・回転操作
    // ==========================================
    let isInteracting = false;
    let touchStartDist = 0;
    let touchStartRadius = 45;
    let previousTouchPos = { x: 0, y: 0 };
    let isTwoFingerPan = false;
    let previousPanCenter = { x: 0, y: 0 };

    function getTouchDistance(e) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function getTouchCenter(e) {
      return {
        x: (e.touches[0].clientX + e.touches[1].clientX) * 0.5,
        y: (e.touches[0].clientY + e.touches[1].clientY) * 0.5
      };
    }

    function onPointerDown(e) {
      if (e.target.closest('#ui-container') || e.target.closest('#mode-floating-btn')) return;
      initAudio();

      if (e.touches && e.touches.length === 2) {
        touchStartDist = getTouchDistance(e);
        touchStartRadius = cameraRadius;
        previousPanCenter = getTouchCenter(e);
        isTwoFingerPan = true;
        isInteracting = false;
        return;
      }

      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      previousTouchPos = { x: clientX, y: clientY };

      isInteracting = true;
      isTwoFingerPan = false;

      if (!isCameraMode) {
        pointer.x = (clientX / window.innerWidth) * 2 - 1;
        pointer.y = -(clientY / window.innerHeight) * 2 + 1;
        
        raycaster.setFromCamera(pointer, camera);
        const intersectPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
        const spawnPos = new THREE.Vector3();
        raycaster.ray.intersectPlane(intersectPlane, spawnPos);
        
        if (!spawnPos) spawnPos.set(0, 5, 0);
        spawnCluster(spawnPos, 4, VEC_TEMP.set(0, 0, 0));
      }
    }

    function onPointerMove(e) {
      if (e.touches && e.touches.length === 2 && isTwoFingerPan) {
        const dist = getTouchDistance(e);
        if (touchStartDist > 0) {
          const factor = touchStartDist / dist;
          cameraRadius = touchStartRadius * factor;
        }

        const currentCenter = getTouchCenter(e);
        const deltaX = currentCenter.x - previousPanCenter.x;
        const deltaY = currentCenter.y - previousPanCenter.y;

        const panSpeed = 0.05 * (cameraRadius / 45);
        const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
        const up = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);

        cameraTarget.add(right.multiplyScalar(-deltaX * panSpeed));
        cameraTarget.add(up.multiplyScalar(deltaY * panSpeed));

        previousPanCenter = currentCenter;
        updateCameraPosition();
        return;
      }

      if (!isInteracting) return;

      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const deltaX = clientX - previousTouchPos.x;
      const deltaY = clientY - previousTouchPos.y;

      const isShiftOrRightClick = e.shiftKey || e.button === 2;

      if (isCameraMode || isShiftOrRightClick) {
        if (isShiftOrRightClick) {
          const panSpeed = 0.05 * (cameraRadius / 45);
          const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
          const up = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);

          cameraTarget.add(right.multiplyScalar(-deltaX * panSpeed));
          cameraTarget.add(up.multiplyScalar(deltaY * panSpeed));
        } else {
          cameraTheta -= deltaX * 0.008;
          cameraPhi -= deltaY * 0.008;
        }
        updateCameraPosition();
      } else {
        if (Math.abs(deltaX) > 4 || Math.abs(deltaY) > 4) {
          pointer.x = (clientX / window.innerWidth) * 2 - 1;
          pointer.y = -(clientY / window.innerHeight) * 2 + 1;
          
          raycaster.setFromCamera(pointer, camera);
          const intersectPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
          const spawnPos = new THREE.Vector3();
          raycaster.ray.intersectPlane(intersectPlane, spawnPos);

          if (spawnPos) {
            VEC_TEMP.set(deltaX * 0.01, -deltaY * 0.01, 0);
            spawnCluster(spawnPos, 2, VEC_TEMP);
          }
        }
      }

      previousTouchPos = { x: clientX, y: clientY };
    }

    function onPointerUp() {
      isInteracting = false;
      isTwoFingerPan = false;
      touchStartDist = 0;
    }

    window.addEventListener('wheel', (e) => {
      if (e.target.closest('#ui-container') || e.target.closest('#mode-floating-btn')) return;
      initAudio();
      cameraRadius += e.deltaY * 0.05;
      updateCameraPosition();
    }, { passive: true });

    window.addEventListener('contextmenu', (e) => e.preventDefault());

    window.addEventListener('touchstart', onPointerDown, { passive: false });
    window.addEventListener('touchmove', onPointerMove, { passive: false });
    window.addEventListener('touchend', onPointerUp);

    window.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    // ★ ② 粒子上限の撤廃（自動削除処理なしで無限生成・進化に対応）
    function spawnCluster(pos, count, impulse, options = {}) {
      for (let i = 0; i < count; i++) {
        const offset = VEC_TEMP.set((Math.random() - 0.5) * 1.5, Math.random() * 1.0, (Math.random() - 0.5) * 1.5);
        const p = new ChibiParticle(pos.x + offset.x, pos.y + offset.y, pos.z + offset.z, impulse, options);
        scene.add(p.mesh);
        particles.push(p);
      }
      playPokoSound(0.85 + Math.min(impulse.length() * 1.2, 0.7), false, pos);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ==========================================
    // 5. 局所衝突 ＆ 融合進化
    // ==========================================
    function handleCollisionsAndFusion() {
      if (reactivityFactor <= 0.01) return;

      for (let i = 0; i < particles.length; i++) {
        const p1 = particles[i];
        if (!p1 || p1.life <= 0 || p1.fusionCooldown > 0) continue;

        const neighbors = getNearbyParticles(p1, tempNeighborBuffer);

        for (let j = 0; j < neighbors.length; j++) {
          const p2 = neighbors[j];
          if (!p2 || p2.life <= 0 || p2.fusionCooldown > 0) continue;

          const dist = p1.mesh.position.distanceTo(p2.mesh.position);
          if (dist < (p1.radius + p2.radius) * 1.05) {
            p1.life = 0;
            p2.life = 0;

            const newType = Math.max(p1.type, p2.type) + 1;
            const fusionPos = new THREE.Vector3().addVectors(p1.mesh.position, p2.mesh.position).multiplyScalar(0.5);
            const fusionVel = new THREE.Vector3().addVectors(p1.velocity, p2.velocity).multiplyScalar(0.5);

            playPokoSound(1.2 + Math.min(newType, 10) * 0.1, true, fusionPos);

            spawnCluster(fusionPos, 1, fusionVel, {
              type: newType,
              radius: Math.min(Math.max(p1.radius, p2.radius) * 1.20, 5.0),
              hue: ((p1.type >= p2.type ? p1.hue : p2.hue) + 0.05),
              attractionPower: Math.min(Math.max(p1.attractionPower, p2.attractionPower) * 1.3, 0.06),
              lifeBonus: Math.min(Math.max(p1.lifeBonus, p2.lifeBonus) * 1.25, 4.0),
              fusionCooldown: 15
            });

            break;
          }
        }
      }
    }

    function updateAudioVoices() {
      if (!isAudioEnabled || !audioCtx || audioCtx.state !== 'running') return;
      
      let count = 0;
      for (let i = 0; i < particles.length && count < MAX_VOICES; i++) {
        const p = particles[i];
        if (p.type > 0 || Math.random() < 0.1) {
          const voice = voicePool[count];
          const speed = p.velocity.length();
          voice.osc.frequency.setTargetAtTime(p.baseFreq + (speed * 320), audioCtx.currentTime, 0.1);
          voice.gain.gain.setTargetAtTime(Math.min(0.0012 + (speed * 0.015), 0.018) * volMotion, audioCtx.currentTime, 0.1);

          if (voice.panner && voice.panner.positionX) {
            voice.panner.positionX.setTargetAtTime(p.mesh.position.x, audioCtx.currentTime, 0.1);
            voice.panner.positionY.setTargetAtTime(p.mesh.position.y, audioCtx.currentTime, 0.1);
            voice.panner.positionZ.setTargetAtTime(p.mesh.position.z, audioCtx.currentTime, 0.1);
          }
          count++;
        }
      }

      for (let i = count; i < MAX_VOICES; i++) {
        voicePool[i].gain.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 0.1);
      }
    }

    updateCameraPosition();

    // ==========================================
    // 6. メインアニメーションループ
    // ==========================================
    function animate() {
      requestAnimationFrame(animate);

      globalTime += 0.01;

      updateSpatialGrid();

      update3DEnvironment();

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        const neighbors = getNearbyParticles(p, tempNeighborBuffer);
        p.applyFlockingRule(neighbors);
      }

      handleCollisionsAndFusion();

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        const neighbors = getNearbyParticles(p, tempNeighborBuffer);
        const alive = p.update(neighbors);

        // ★ ② 大型粒子は寿命到来時に「必ず」一つ前のフェーズ（Type - 1）に確実分解・還元
        if (p.decomposed) {
          const parentPos = p.mesh.position.clone();
          const parentVel = p.velocity.clone();
          const prevType = p.type - 1;

          p.destroy();
          particles.splice(i, 1);

          playPokoSound(0.9 + prevType * 0.1, true, parentPos);

          const spawnCount = prevType === 0 ? 3 : 2;
          for (let k = 0; k < spawnCount; k++) {
            const spreadVel = new THREE.Vector3(
              (Math.random() - 0.5) * 0.3,
              0.1 + Math.random() * 0.2,
              (Math.random() - 0.5) * 0.3
            ).add(parentVel.clone().multiplyScalar(0.2));

            spawnCluster(parentPos, 1, spreadVel, {
              type: prevType,
              radius: Math.max(0.28, p.radius / 1.25),
              hue: p.hue + (k * 0.03),
              attractionPower: Math.max(0.007, p.attractionPower / 1.15),
              lifeBonus: Math.max(1.0, p.lifeBonus / 1.1),
              fusionCooldown: 40
            });
          }
          continue;
        }

        if (!alive) {
          p.destroy();
          particles.splice(i, 1);
        }
      }

      updateAudioVoices();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
