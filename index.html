<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>UNERI Flow - 3D Environment & Multi-Cluster Life Loop</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #04060a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #mode-floating-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 100;
      background: rgba(10, 14, 24, 0.88);
      border: 1px solid rgba(0, 255, 210, 0.6);
      color: #00ffd2;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: bold;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 15px rgba(0, 255, 210, 0.25);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.25s ease;
      pointer-events: auto;
    }

    #mode-floating-btn:hover {
      background: rgba(20, 30, 48, 0.95);
      border-color: #00ffd2;
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(0, 255, 210, 0.4);
    }

    #mode-floating-btn.active {
      background: rgba(0, 255, 210, 0.25);
      color: #ffffff;
    }

    #ui-container {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 90;
      color: #e0f0ff;
      pointer-events: auto;
      background: rgba(10, 14, 24, 0.9);
      padding: 16px;
      border-radius: 14px;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 255, 210, 0.3);
      width: 290px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      transition: all 0.3s ease;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    #ui-container.collapsed {
      width: 48px !important;
      height: 48px;
      padding: 0;
      border-radius: 24px;
      cursor: pointer;
      overflow: hidden;
    }

    .ui-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .ui-header-actions {
      display: flex;
      gap: 6px;
    }

    h1 {
      margin: 0;
      font-size: 1.05rem;
      color: #00ffd2;
      letter-spacing: 0.08em;
    }

    .concept-sub {
      margin: 0 0 10px 0;
      font-size: 0.68rem;
      color: #88d8c0;
      line-height: 1.35;
    }

    .icon-btn {
      background: rgba(0, 255, 210, 0.15);
      border: 1px solid rgba(0, 255, 210, 0.4);
      color: #00ffd2;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .collapsed-icon {
      display: none;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: #00ffd2;
    }

    #ui-container.collapsed .tab-container,
    #ui-container.collapsed .tab-content,
    #ui-container.collapsed .ui-header,
    #ui-container.collapsed .concept-sub {
      display: none;
    }

    #ui-container.collapsed .collapsed-icon {
      display: flex;
    }

    .tab-container {
      display: flex;
      border-bottom: 1px solid rgba(0, 255, 210, 0.3);
      margin-bottom: 12px;
      gap: 4px;
    }

    .tab-btn {
      flex: 1;
      padding: 6px 0;
      font-size: 0.65rem;
      text-align: center;
      background: rgba(0, 255, 210, 0.05);
      color: #88d8c0;
      border: none;
      border-radius: 6px 6px 0 0;
      cursor: pointer;
      font-weight: bold;
    }

    .tab-btn.active {
      background: rgba(0, 255, 210, 0.25);
      color: #00ffd2;
      border-bottom: 2px solid #00ffd2;
    }

    .tab-content {
      display: none;
      max-height: 48vh;
      overflow-y: auto;
    }

    .tab-content.active {
      display: block;
    }

    .guide-section {
      background: rgba(0, 255, 210, 0.05);
      border: 1px solid rgba(0, 255, 210, 0.2);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }

    .guide-title {
      font-size: 0.7rem;
      font-weight: bold;
      color: #00ffd2;
      margin-bottom: 6px;
    }

    .guide-list {
      font-size: 0.64rem;
      color: #b0f0e0;
      line-height: 1.5;
      margin: 0;
      padding-left: 14px;
    }

    .shortcut-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.62rem;
      color: #b0f0e0;
    }

    .shortcut-table td {
      padding: 3px 0;
    }

    kbd {
      background: rgba(0, 255, 210, 0.2);
      border: 1px solid rgba(0, 255, 210, 0.4);
      color: #ffffff;
      padding: 1px 5px;
      border-radius: 4px;
      font-family: monospace;
    }

    .control-group {
      margin-bottom: 10px;
    }

    label {
      display: flex;
      justify-content: space-between;
      font-size: 0.68rem;
      color: #a0f0e0;
      margin-bottom: 2px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #00ffd2;
      cursor: pointer;
      height: 4px;
    }

    .switch-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 0.7rem;
      color: #a0f0e0;
    }

    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 18px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider-round {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255, 255, 255, 0.2);
      border-radius: 18px;
      border: 1px solid rgba(0, 255, 210, 0.4);
    }

    .slider-round:before {
      position: absolute;
      content: "";
      height: 12px;
      width: 12px;
      left: 2px;
      bottom: 2px;
      background-color: #00ffd2;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider-round {
      background-color: rgba(0, 255, 210, 0.4);
    }

    input:checked + .slider-round:before {
      transform: translateX(18px);
      background-color: #ffffff;
    }

    .action-btn {
      width: 100%;
      padding: 8px;
      margin-top: 6px;
      background: rgba(255, 90, 90, 0.15);
      border: 1px solid rgba(255, 90, 90, 0.4);
      color: #ff9090;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.7rem;
      font-weight: bold;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <button id="mode-floating-btn" title="視点操作モード（Spaceキー）">
    <span id="mode-icon">✨</span>
    <span id="mode-text">粒子発生モード</span>
  </button>

  <div id="ui-container">
    <div class="collapsed-icon" title="メニューを開く">⚙️</div>

    <div class="ui-header">
      <h1>UNERI Flow</h1>
      <div class="ui-header-actions">
        <div class="icon-btn" id="reset-cam-btn" title="視点を最初に戻す (Rキー)">🏠</div>
        <div class="icon-btn" id="toggle-btn" title="メニューを折りたたむ">─</div>
      </div>
    </div>
    
    <p class="concept-sub">衝突、進化、崩壊。<br>粒子の生態系を『持続』させる調和を見つけ出そう。</p>

    <div class="tab-container">
      <button class="tab-btn active" data-tab="tab-control">🎮 操作</button>
      <button class="tab-btn" data-tab="tab-eco">🌿 生態系</button>
      <button class="tab-btn" data-tab="tab-audio">🔊 音響</button>
    </div>

    <!-- タブ1: 操作説明 -->
    <div class="tab-content active" id="tab-control">
      <div class="guide-section">
        <div class="guide-title">📱 タッチ / マウス操作方法</div>
        <ul class="guide-list">
          <li><strong>粒子発生:</strong> 1本指ドラッグ / クリックドラッグ</li>
          <li><strong>視点移動:</strong> 2本指ドラッグ（または視点操作モード）</li>
          <li><strong>ズーム:</strong> ピンチイン・アウト / ホイール</li>
        </ul>
      </div>

      <div class="guide-section">
        <div class="guide-title">⌨️ PCキーボードショートカット</div>
        <table class="shortcut-table">
          <tr><td><kbd>Space</kbd></td><td>視点操作モード 切替</td></tr>
          <tr><td><kbd>Shift</kbd> + ドラッグ</td><td>視点並行移動</td></tr>
          <tr><td><kbd>R</kbd></td><td>視点リセット</td></tr>
          <tr><td><kbd>+</kbd> / <kbd>-</kbd></td><td>ズームイン / アウト</td></tr>
          <tr><td><kbd>C</kbd></td><td>全粒子リセット</td></tr>
        </table>
      </div>

      <button class="action-btn" id="clear-particles-btn">🗑️ 全粒子をリセット (C)</button>
    </div>

    <!-- タブ2: 生態系パラメーター -->
    <div class="tab-content" id="tab-eco">
      <div class="switch-group">
        <span>画面端での反転 (跳ね返り)</span>
        <label class="toggle-switch">
          <input type="checkbox" id="boundary-enable" checked>
          <span class="slider-round"></span>
        </label>
      </div>

      <div class="control-group">
        <label><span>孤独時の寿命の縮みやすさ</span><span id="exp-val">2.2</span></label>
        <input type="range" id="exp-slider" min="1.0" max="3.5" step="0.1" value="2.2">
      </div>

      <div class="control-group">
        <label><span>「ひとりぼっち」の判定基準</span><span id="thresh-val">0.0010</span></label>
        <input type="range" id="thresh-slider" min="0.0000" max="0.0050" step="0.0002" value="0.0010">
      </div>

      <div class="control-group">
        <label><span>衝突で合体・進化する確率</span><span id="react-val">1.0</span></label>
        <input type="range" id="react-slider" min="0.0" max="3.0" step="0.1" value="1.0">
      </div>

      <div class="control-group">
        <label><span>進化粒子の寿命（分解時間）</span><span id="decay-val">1.0</span></label>
        <input type="range" id="decay-slider" min="0.1" max="3.0" step="0.1" value="1.0">
      </div>

      <div class="control-group">
        <label><span>進化粒子の最大サイズ上限</span><span id="size-val">1.20</span></label>
        <input type="range" id="size-slider" min="0.5" max="2.5" step="0.05" value="1.20">
      </div>
    </div>

    <!-- タブ3: 音響設定 -->
    <div class="tab-content" id="tab-audio">
      <div class="switch-group">
        <span>マスター音声 (Sound ON/OFF)</span>
        <label class="toggle-switch">
          <input type="checkbox" id="audio-enable" checked>
          <span class="slider-round"></span>
        </label>
      </div>

      <div class="control-group">
        <label><span>粒子発生音 (Spawn Volume)</span><span id="vol-spawn-val">1.5</span></label>
        <input type="range" id="vol-spawn-slider" min="0.0" max="4.0" step="0.1" value="1.5">
      </div>

      <div class="control-group">
        <label><span>粒子移動音 (Motion Volume)</span><span id="vol-motion-val">2.0</span></label>
        <input type="range" id="vol-motion-slider" min="0.0" max="5.0" step="0.1" value="2.0">
      </div>

      <div class="control-group">
        <label><span>粒子融合/分解音 (Fusion Volume)</span><span id="vol-fusion-val">1.5</span></label>
        <input type="range" id="vol-fusion-slider" min="0.0" max="4.0" step="0.1" value="1.5">
      </div>
    </div>

  </div>

  <script>
    // ==========================================
    // 0. UI・制御変数
    // ==========================================
    let globalTime = 0;
    let expFactor = 2.2;
    let thresholdValue = 0.0010;
    let reactivityFactor = 1.0; 
    let decayTimeFactor = 1.0;  
    let sizeLimitThreshold = 1.20; 

    let isBoundaryBounceEnabled = true;

    let isAudioEnabled = true;
    let volSpawn = 1.5;
    let volMotion = 2.0;
    let volFusion = 1.5;

    let isCameraMode = false; 
    let isShiftPressed = false; 

    let isCameraTransforming = false; 
    let camTransformTimeout = null;

    function triggerCameraTransform() {
      isCameraTransforming = true;
      if (camTransformTimeout) clearTimeout(camTransformTimeout);
      camTransformTimeout = setTimeout(() => { isCameraTransforming = false; }, 350); 
    }

    const uiContainer = document.getElementById('ui-container');
    const toggleBtn = document.getElementById('toggle-btn');
    const resetCamBtn = document.getElementById('reset-cam-btn');
    
    const modeFloatingBtn = document.getElementById('mode-floating-btn');
    const modeIcon = document.getElementById('mode-icon');
    const modeText = document.getElementById('mode-text');

    function toggleUI(e) {
      if (e) e.stopPropagation();
      uiContainer.classList.toggle('collapsed');
    }

    toggleBtn.addEventListener('click', toggleUI);
    uiContainer.addEventListener('click', (e) => {
      if (uiContainer.classList.contains('collapsed')) toggleUI(e);
    });

    const tabBtns = document.querySelectorAll('.tab-btn');
    const tabContents = document.querySelectorAll('.tab-content');

    tabBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const targetTab = btn.getAttribute('data-tab');

        tabBtns.forEach(b => b.classList.remove('active'));
        tabContents.forEach(c => c.classList.remove('active'));

        btn.classList.add('active');
        document.getElementById(targetTab).classList.add('active');
      });
    });

    function setCameraMode(enabled) {
      isCameraMode = enabled;
      modeFloatingBtn.classList.toggle('active', isCameraMode);
      if (isCameraMode) {
        modeIcon.textContent = '🔍';
        modeText.textContent = '視点操作モード';
      } else {
        modeIcon.textContent = '✨';
        modeText.textContent = '粒子発生モード';
      }
    }

    modeFloatingBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      setCameraMode(!isCameraMode);
    });

    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (e.code === 'Space') {
        e.preventDefault();
        setCameraMode(!isCameraMode);
      } else if (e.key === 'Shift') {
        isShiftPressed = true;
      } else if (e.key === 'r' || e.key === 'R') {
        resetCameraPos();
      } else if (e.key === '+' || e.key === '=') {
        zoomCamera(-2);
      } else if (e.key === '-' || e.key === '_') {
        zoomCamera(2);
      } else if (e.key === 'c' || e.key === 'C') {
        clearAllParticles();
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'Shift') isShiftPressed = false;
    });

    const bindSlider = (sliderId, displayId, callback) => {
      const slider = document.getElementById(sliderId);
      const display = document.getElementById(displayId);
      slider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        display.textContent = val.toFixed(1);
        callback(val);
      });
    };

    document.getElementById('boundary-enable').addEventListener('change', (e) => {
      isBoundaryBounceEnabled = e.target.checked;
    });

    bindSlider('exp-slider', 'exp-val', v => expFactor = v);
    document.getElementById('thresh-slider').addEventListener('input', (e) => {
      thresholdValue = parseFloat(e.target.value);
      document.getElementById('thresh-val').textContent = thresholdValue.toFixed(4);
    });

    bindSlider('react-slider', 'react-val', v => reactivityFactor = v);
    bindSlider('decay-slider', 'decay-val', v => decayTimeFactor = v);
    document.getElementById('size-slider').addEventListener('input', (e) => {
      sizeLimitThreshold = parseFloat(e.target.value);
      document.getElementById('size-val').textContent = sizeLimitThreshold.toFixed(2);
    });

    document.getElementById('audio-enable').addEventListener('change', (e) => {
      isAudioEnabled = e.target.checked;
      if (audioCtx) {
        if (isAudioEnabled) audioCtx.resume();
        else audioCtx.suspend();
      }
    });

    bindSlider('vol-spawn-slider', 'vol-spawn-val', v => volSpawn = v);
    bindSlider('vol-motion-slider', 'vol-motion-val', v => volMotion = v);
    bindSlider('vol-fusion-slider', 'vol-fusion-val', v => volFusion = v);

    // ==========================================
    // 1. Web Audio API サラウンド音響
    // ==========================================
    let audioCtx = null;
    let masterFilter = null;
    const MAX_VOICES = 8;
    const voicePool = [];

    function initAudio() {
      if (!isAudioEnabled) return;
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
          
          masterFilter = audioCtx.createBiquadFilter();
          masterFilter.type = 'lowpass';
          masterFilter.frequency.setValueAtTime(1800, audioCtx.currentTime);
          masterFilter.connect(audioCtx.destination);

          for (let i = 0; i < MAX_VOICES; i++) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            let panner = null;
            if (audioCtx.createPanner) {
              panner = audioCtx.createPanner();
              panner.panningModel = 'HRTF';
              panner.distanceModel = 'inverse';
              panner.refDistance = 5;
              panner.rolloffFactor = 1.5;
            }

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(220, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
            
            if (panner) {
              osc.connect(gain);
              gain.connect(panner);
              panner.connect(masterFilter);
            } else {
              osc.connect(gain);
              gain.connect(masterFilter);
            }

            osc.start();
            voicePool.push({ osc, gain, panner });
          }
        }
      }
      if (audioCtx && audioCtx.state === 'suspended' && isAudioEnabled) {
        audioCtx.resume();
      }
    }

    function playPokoSound(pitchRatio = 1.0, isFusion = false, pos = null) {
      if (!isAudioEnabled || !audioCtx || audioCtx.state !== 'running') return;
      const baseVolume = isFusion ? volFusion : volSpawn;
      if (baseVolume <= 0.001) return;

      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        let panner = null;
        if (pos && audioCtx.createPanner) {
          panner = audioCtx.createPanner();
          panner.positionX.setValueAtTime(pos.x, audioCtx.currentTime);
          panner.positionY.setValueAtTime(pos.y, audioCtx.currentTime);
          panner.positionZ.setValueAtTime(pos.z, audioCtx.currentTime);
        }

        const baseFreq = 260 + Math.random() * 200;
        osc.frequency.setValueAtTime(baseFreq * pitchRatio, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(baseFreq * 2.6 * pitchRatio, audioCtx.currentTime + 0.05);

        const targetGain = 0.18 * baseVolume;
        gain.gain.setValueAtTime(targetGain, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.06);

        if (panner) {
          osc.connect(gain);
          gain.connect(panner);
          panner.connect(masterFilter || audioCtx.destination);
        } else {
          osc.connect(gain);
          gain.connect(masterFilter || audioCtx.destination);
        }

        osc.start();
        osc.stop(audioCtx.currentTime + 0.07);
      } catch (e) {}
    }

    // ==========================================
    // 2. Three.js セットアップ & 復元ライティング (③の修正)
    // ==========================================
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x04060a, 0.0005); 

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 50000);
    
    let targetZoom = 30;
    let targetCamPos = new THREE.Vector3(0, 0, targetZoom);
    camera.position.set(0, 0, targetZoom);

    function resetCameraPos() {
      targetZoom = 30;
      targetCamPos.set(0, 0, targetZoom);
      triggerCameraTransform();
    }

    function zoomCamera(delta) {
      targetZoom = Math.max(5, targetZoom + delta);
      triggerCameraTransform();
    }

    resetCamBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      resetCameraPos();
    });

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // 【③ 修正】元の深い陰影とクリアな輝きを生むライティング構成
    const ambientLight = new THREE.AmbientLight(0x223344, 0.8);
    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(0x00ffd2, 1.3);
    mainLight.position.set(20, 35, 25);
    scene.add(mainLight);

    const subLight = new THREE.DirectionalLight(0xff4080, 0.7);
    subLight.position.set(-25, -20, -10);
    scene.add(subLight);

    const raycaster = new THREE.Raycaster();
    const mousePlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
    const pointer = new THREE.Vector2();
    const intersectPoint = new THREE.Vector3();

    // ==========================================
    // 2.5 高視認性3Dノイズフィールド＆立体流速 (①＆②の修正)
    // ==========================================
    // 1. 高コントラスト＆高視認性3D地形メッシュ（山・谷・地平線）
    const GRID_X = 50;
    const GRID_Y = 50;
    const fieldPlaneGeo = new THREE.PlaneGeometry(320, 320, GRID_X, GRID_Y);
    
    // 発光感を高めたアクアブルーのマテリアル
    const fieldMat = new THREE.MeshBasicMaterial({
      color: 0x00ffd2,
      wireframe: true,
      transparent: true,
      opacity: 0.65, // ① 劇的に見えやすく高コントラスト化
      blending: THREE.AdditiveBlending
    });
    
    const fieldMesh = new THREE.Mesh(fieldPlaneGeo, fieldMat);
    fieldMesh.rotation.x = -Math.PI * 0.32; // ② 奥に地平線ができる傾き
    fieldMesh.position.z = -18;
    scene.add(fieldMesh);

    // 2. 立体的な「風」の流れを表現する3D流線群 (② 3次元の風表現)
    const WIND_COUNT = 40;
    const windGroup = new THREE.Group();
    const windData = [];

    for (let w = 0; w < WIND_COUNT; w++) {
      const pGeo = new THREE.BufferGeometry();
      const pCount = 12;
      const positions = new Float32Array(pCount * 3);
      pGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

      const pMat = new THREE.LineBasicMaterial({
        color: 0x7ef1d3,
        transparent: true,
        opacity: 0.7,
        blending: THREE.AdditiveBlending
      });

      const line = new THREE.Line(pGeo, pMat);
      windGroup.add(line);

      windData.push({
        line: line,
        geo: pGeo,
        x: (Math.random() - 0.5) * 200,
        y: (Math.random() - 0.5) * 150,
        z: (Math.random() - 0.5) * 80 - 10,
        speed: 0.6 + Math.random() * 0.8
      });
    }
    scene.add(windGroup);

    function get3DNoiseVector(x, y, z, time) {
      // 3次元でうねる風と地形の高低差ベクトル
      const waveX = Math.sin(x * 0.02 + time * 0.5) * Math.cos(z * 0.02);
      const waveY = Math.cos(y * 0.02 + time * 0.4) * Math.sin(x * 0.02);
      const waveZ = Math.sin(z * 0.03 + time * 0.6) * Math.cos(y * 0.02);

      const mountain = Math.sin(x * 0.015) * Math.cos(y * 0.015) * 18.0; // 山脈・谷の高低差

      return {
        flow: new THREE.Vector3(waveX * 0.01, waveY * 0.01, waveZ * 0.008),
        mountainZ: mountain
      };
    }

    function update3DEnvironment() {
      // 地形メッシュの波打ちと高低差更新
      const posAttr = fieldPlaneGeo.attributes.position;
      for (let i = 0; i < posAttr.count; i++) {
        const x = posAttr.getX(i);
        const y = posAttr.getY(i);
        const noise = get3DNoiseVector(x + targetCamPos.x, y + targetCamPos.y, 0, globalTime);
        const dynamicZ = noise.mountainZ + Math.sin(x * 0.04 + globalTime * 2.0) * Math.cos(y * 0.04) * 8.0;
        posAttr.setZ(i, dynamicZ);
      }
      posAttr.needsUpdate = true;
      fieldMesh.position.x = targetCamPos.x;
      fieldMesh.position.y = targetCamPos.y + 15;

      // 3D風の流線アニメーション（手前・奥へ通り抜けるうねり）
      windData.forEach(w => {
        const pos = w.geo.attributes.position.array;
        let currX = w.x + Math.sin(globalTime * w.speed) * 30;
        let currY = w.y + Math.cos(globalTime * w.speed * 0.7) * 20;
        let currZ = w.z;

        for (let p = 0; p < 12; p++) {
          pos[p * 3] = currX + p * 2.0;
          pos[p * 3 + 1] = currY + Math.sin(currX * 0.04 + globalTime * 2.5 + p * 0.3) * 6.0;
          pos[p * 3 + 2] = currZ + Math.cos(currY * 0.04 + globalTime * 2.0 + p * 0.3) * 6.0;
          currX += 1.8;
        }
        w.geo.attributes.position.needsUpdate = true;
      });
      windGroup.position.x = targetCamPos.x;
      windGroup.position.y = targetCamPos.y;
    }

    // ==========================================
    // 3. 粒子クラス（③の美質感マテリアル復元）
    // ==========================================
    const MAX_PARTICLES = 1000;
    let particles = [];

    function clearAllParticles() {
      for (let i = 0; i < particles.length; i++) particles[i].destroy();
      particles = [];
    }

    document.getElementById('clear-particles-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      clearAllParticles();
    });

    const baseSphereGeo = new THREE.SphereGeometry(0.28, 16, 16);

    class ChibiParticle {
      constructor(x, y, z, initialVel, options = {}) {
        // 【③ 修正】光と反射を受ける Phong マテリアル
        this.material = new THREE.MeshPhongMaterial({
          color: 0x00ffd2,
          emissive: 0x022018,
          specular: 0xffffff,
          shininess: 90,
          transparent: true,
          opacity: 0.92
        });

        this.mesh = new THREE.Mesh(baseSphereGeo, this.material);
        this.mesh.position.set(x, y, z);
        
        this.type = options.type !== undefined ? options.type : 0;
        this.radius = Math.min(options.radius !== undefined ? options.radius : 0.28, 4.5);
        this.hue = options.hue !== undefined ? options.hue : (0.40 + Math.random() * 0.18);
        this.attractionPower = options.attractionPower !== undefined ? Math.min(options.attractionPower, 0.06) : 0.008;
        this.lifeBonus = options.lifeBonus !== undefined ? Math.min(options.lifeBonus, 3.5) : 1.0;
        
        this.mesh.scale.setScalar(this.radius / 0.28);
        this.material.color.setHSL(this.hue % 1.0, 0.85, 0.60);

        this.velocity = initialVel.clone().add(new THREE.Vector3(
          (Math.random() - 0.5) * 0.1,
          (Math.random() - 0.5) * 0.1,
          (Math.random() - 0.5) * 0.1
        ));

        this.life = 1.0;
        this.baseDecay = (0.025 + Math.random() * 0.005) / this.lifeBonus;
        this.age = 0;
        this.decomposed = false;
        this.fusionCooldown = options.fusionCooldown !== undefined ? options.fusionCooldown : 15;

        this.baseFreq = (80 + Math.random() * 120) * Math.pow(0.9, Math.min(this.type, 8));
      }

      applyFlockingRule(neighbors, bounds) {
        const cohesion = new THREE.Vector3();
        const separation = new THREE.Vector3();
        const alignment = new THREE.Vector3();
        let count = 0;

        // 【④ 修正】ローカルのみの集束計算で複数箇所に個別の凝集体を作る
        for (let i = 0; i < neighbors.length; i++) {
          const other = neighbors[i];
          const dist = this.mesh.position.distanceTo(other.mesh.position);

          if (dist > 0 && dist < 6.0) {
            cohesion.add(other.mesh.position);
            alignment.add(other.velocity);

            if (dist < (1.1 * (this.radius + other.radius) / 0.56)) {
              const push = new THREE.Vector3().subVectors(this.mesh.position, other.mesh.position);
              push.normalize().divideScalar(Math.max(dist, 0.1));
              separation.add(push);
            }
            count++;
          }
        }

        if (count > 0) {
          cohesion.divideScalar(count);
          const cohesionForce = new THREE.Vector3().subVectors(cohesion, this.mesh.position).multiplyScalar(this.attractionPower);
          this.velocity.add(cohesionForce);
          alignment.divideScalar(count).multiplyScalar(0.025);
          this.velocity.add(alignment);
          separation.multiplyScalar(0.025);
          this.velocity.add(separation);
        }

        // 3D環境風を粒子に与える
        const env = get3DNoiseVector(this.mesh.position.x, this.mesh.position.y, this.mesh.position.z, globalTime);
        this.velocity.add(env.flow);

        if (isBoundaryBounceEnabled && !isCameraTransforming) {
          const minX = targetCamPos.x - bounds.x;
          const maxX = targetCamPos.x + bounds.x;
          const minY = targetCamPos.y - bounds.y;
          const maxY = targetCamPos.y + bounds.y;

          if (this.mesh.position.x > maxX) this.velocity.x -= 0.03;
          if (this.mesh.position.x < minX) this.velocity.x += 0.03;
          if (this.mesh.position.y > maxY) this.velocity.y -= 0.03;
          if (this.mesh.position.y < minY) this.velocity.y += 0.03;
        }
      }

      update(allParticles) {
        this.velocity.multiplyScalar(0.97);
        this.mesh.position.add(this.velocity);
        this.age += 1;

        if (this.fusionCooldown > 0) this.fusionCooldown--;

        if (this.type > 0) {
          let baseDecomposeAge = (220 + this.type * 90) * decayTimeFactor;
          if (this.radius > sizeLimitThreshold) {
            baseDecomposeAge /= Math.max(1.1, Math.pow(this.radius / sizeLimitThreshold, 2));
          }
          if (this.age > baseDecomposeAge) {
            this.decomposed = true;
            return false;
          }
          this.material.opacity = 0.92;
          return true; 
        }

        let proximitySupport = 0;
        for (let i = 0; i < allParticles.length; i++) {
          const other = allParticles[i];
          if (other !== this) {
            const dist = this.mesh.position.distanceTo(other.mesh.position);
            if (dist < 12.0) {
              proximitySupport += (1.0 / Math.pow(dist + 0.1, expFactor)) * 0.0035;
            }
          }
        }

        let totalSupport = (proximitySupport > thresholdValue) ? (proximitySupport + allParticles.length * 0.00003) : 0;
        this.life -= Math.max(0.0003, this.baseDecay - totalSupport);
        this.material.opacity = Math.max(0, this.life * 0.92);

        return this.life > 0;
      }

      destroy() {
        scene.remove(this.mesh);
        this.mesh.geometry.dispose();
        this.material.dispose();
      }
    }

    // ==========================================
    // 4. 操作制御（ピンチ・ドラッグ）
    // ==========================================
    let isInteracting = false;
    let isPanDragging = false;
    let lastPos = new THREE.Vector3();
    let dragVelocity = new THREE.Vector3();
    let initialPinchDistance = null;

    function getPointerPos(e) {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      pointer.x = (clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(clientY / window.innerHeight) * 2 + 1;

      mousePlane.constant = -targetCamPos.z + targetZoom;
      raycaster.setFromCamera(pointer, camera);
      raycaster.ray.intersectPlane(mousePlane, intersectPoint);
    }

    function onPointerDown(e) {
      if (e.target.closest('#ui-container') || e.target.closest('#mode-floating-btn')) return;
      initAudio();

      if (isCameraMode || isShiftPressed) {
        isPanDragging = true;
        isInteracting = false;
        getPointerPos(e);
        lastPos.copy(intersectPoint);
        triggerCameraTransform();
        return;
      }

      isInteracting = true;
      isPanDragging = false;
      getPointerPos(e);
      lastPos.copy(intersectPoint);
      dragVelocity.set(0, 0, 0);

      spawnCluster(intersectPoint, 4, new THREE.Vector3());
    }

    function onPointerMove(e) {
      if (isPanDragging && (isCameraMode || isShiftPressed)) {
        triggerCameraTransform();
        getPointerPos(e);
        targetCamPos.x -= (intersectPoint.x - lastPos.x) * 0.6;
        targetCamPos.y -= (intersectPoint.y - lastPos.y) * 0.6;
        return;
      }

      if (!isInteracting) return;
      getPointerPos(e);

      dragVelocity.subVectors(intersectPoint, lastPos);
      if (dragVelocity.lengthSq() > 0.04) {
        const count = Math.min(Math.floor(dragVelocity.length() * 4) + 1, 5);
        const impulse = dragVelocity.clone().multiplyScalar(0.15);
        if (impulse.length() > 0.2) impulse.normalize().multiplyScalar(0.2);

        spawnCluster(intersectPoint, count, impulse);
        lastPos.copy(intersectPoint);
      }
    }

    function onPointerUp() {
      isInteracting = false;
      isPanDragging = false;
    }

    window.addEventListener('wheel', (e) => {
      if (e.target.closest('#ui-container') || e.target.closest('#mode-floating-btn')) return;
      initAudio();
      triggerCameraTransform();
      targetZoom = Math.max(5, targetZoom + e.deltaY * 0.00075 * targetZoom);
    }, { passive: true });

    function spawnCluster(pos, count, impulse, options = {}) {
      for (let i = 0; i < count; i++) {
        if (particles.length >= MAX_PARTICLES) {
          const oldest = particles.shift();
          oldest.destroy();
        }

        const offset = new THREE.Vector3((Math.random() - 0.5) * 1.2, (Math.random() - 0.5) * 1.2, (Math.random() - 0.5) * 0.8);
        const p = new ChibiParticle(pos.x + offset.x, pos.y + offset.y, pos.z + offset.z, impulse, options);
        scene.add(p.mesh);
        particles.push(p);
      }
      playPokoSound(0.85 + Math.min(impulse.length() * 1.2, 0.7), false, pos);
    }

    window.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ==========================================
    // 5. 【④ 修正】複数個所の完全独立・無制限粒子凝集システム
    // ==========================================
    function handleCollisionsAndFusion() {
      if (reactivityFactor <= 0.01) return;

      for (let i = 0; i < particles.length; i++) {
        const p1 = particles[i];
        if (!p1 || p1.life <= 0 || p1.fusionCooldown > 0) continue;

        for (let j = i + 1; j < particles.length; j++) {
          const p2 = particles[j];
          if (!p2 || p2.life <= 0 || p2.fusionCooldown > 0) continue;

          // 場所に一切関わらず局所の接触距離のみで判定
          const dist = p1.mesh.position.distanceTo(p2.mesh.position);
          if (dist < (p1.radius + p2.radius) * 1.05) {
            p1.life = 0;
            p2.life = 0;

            const newType = Math.max(p1.type, p2.type) + 1;
            const fusionPos = new THREE.Vector3().addVectors(p1.mesh.position, p2.mesh.position).multiplyScalar(0.5);
            const fusionVel = new THREE.Vector3().addVectors(p1.velocity, p2.velocity).multiplyScalar(0.5);

            playPokoSound(1.2 + Math.min(newType, 10) * 0.1, true, fusionPos);

            // 画面のどこであっても独立して新たな凝集体が生成・巨大化
            spawnCluster(fusionPos, 1, fusionVel, {
              type: newType,
              radius: Math.min(Math.max(p1.radius, p2.radius) * 1.18, 4.2),
              hue: ((p1.type >= p2.type ? p1.hue : p2.hue) + 0.05),
              attractionPower: Math.min(Math.max(p1.attractionPower, p2.attractionPower) * 1.3, 0.06),
              lifeBonus: Math.min(Math.max(p1.lifeBonus, p2.lifeBonus) * 1.25, 4.0),
              fusionCooldown: 15
            });

            break;
          }
        }
      }
    }

    function updateAudioVoices() {
      if (!isAudioEnabled || !audioCtx || audioCtx.state !== 'running') return;
      const activeParticles = particles.slice().sort((a, b) => b.velocity.lengthSq() - a.velocity.lengthSq()).slice(0, MAX_VOICES);

      for (let i = 0; i < MAX_VOICES; i++) {
        const voice = voicePool[i];
        const p = activeParticles[i];

        if (p && p.life > 0 && volMotion > 0.001) {
          const speed = p.velocity.length();
          voice.osc.frequency.setTargetAtTime(p.baseFreq + (speed * 320), audioCtx.currentTime, 0.08);
          voice.gain.gain.setTargetAtTime(Math.min(0.0012 + (speed * 0.015), 0.018) * volMotion, audioCtx.currentTime, 0.08);

          if (voice.panner && voice.panner.positionX) {
            voice.panner.positionX.setTargetAtTime(p.mesh.position.x, audioCtx.currentTime, 0.05);
            voice.panner.positionY.setTargetAtTime(p.mesh.position.y, audioCtx.currentTime, 0.05);
            voice.panner.positionZ.setTargetAtTime(p.mesh.position.z, audioCtx.currentTime, 0.05);
          }
        } else {
          voice.gain.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 0.08);
        }
      }
    }

    // ==========================================
    // 6. メインアニメーションループ
    // ==========================================
    function animate() {
      requestAnimationFrame(animate);

      globalTime += 0.01;
      targetCamPos.z = targetZoom;
      camera.position.lerp(targetCamPos, 0.055);

      // ①＆② 3D環境・風・地形の更新
      update3DEnvironment();

      const vFOV = THREE.MathUtils.degToRad(camera.fov);
      const visibleHeight = 2 * Math.tan(vFOV / 2) * camera.position.z;
      const bounds = { x: (visibleHeight * camera.aspect / 2) * 0.85, y: (visibleHeight / 2) * 0.85 };

      for (let i = 0; i < particles.length; i++) {
        particles[i].applyFlockingRule(particles, bounds);
      }

      // ④ 独立した複数凝集体の衝突処理
      handleCollisionsAndFusion();

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        const alive = p.update(particles);

        if (p.decomposed) {
          const parentPos = p.mesh.position.clone();
          const parentVel = p.velocity.clone();
          const prevType = p.type - 1;

          p.destroy();
          particles.splice(i, 1);

          playPokoSound(0.9 + prevType * 0.1, true, parentPos);

          spawnCluster(parentPos, 2, parentVel.negate().multiplyScalar(0.25), {
            type: prevType,
            radius: Math.max(0.28, p.radius / 1.12),
            hue: p.hue,
            attractionPower: Math.max(0.007, p.attractionPower / 1.2),
            lifeBonus: Math.max(1.0, p.lifeBonus / 1.15),
            fusionCooldown: 30
          });
          continue;
        }

        if (!alive) {
          p.destroy();
          particles.splice(i, 1);
        }
      }

      updateAudioVoices();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
